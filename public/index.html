<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── header ── */
    header {
      padding: 10px 20px;
      border-bottom: 1px solid #1e1e2e;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: #a78bfa; margin-right: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #374151; transition: background 0.3s; }
    .dot.alive { background: #22c55e; box-shadow: 0 0 6px #22c55e; }

    /* ── name field ── */
    .name-area {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .name-area label {
      font-size: 0.7rem;
      color: #4b5563;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #name-input {
      background: #1a1a24;
      border: 1px solid #2d2d3d;
      border-radius: 8px;
      padding: 5px 10px;
      color: #e8e8f0;
      font-size: 0.82rem;
      width: 160px;
      outline: none;
      transition: border-color 0.2s;
    }
    #name-input:focus { border-color: #7c3aed; }
    #name-input:disabled { opacity: 0.5; }
    #name-set-btn {
      padding: 5px 12px;
      font-size: 0.75rem;
      background: #4c1d95;
      border-color: #7c3aed;
      color: #e8e8f0;
    }
    #name-set-btn:hover:not(:disabled) { background: #5b21b6; }
    .name-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1a24;
      border: 1px solid #3b2f6e;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.8rem;
      color: #a78bfa;
      cursor: default;
    }
    .name-badge .change-btn {
      font-size: 0.65rem;
      color: #4b5563;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
    }
    .name-badge .change-btn:hover { color: #9ca3af; }
    #name-badge-area { display: none; }

    /* ── 3-column layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .col-voice { flex: 0 0 280px; border-right: 1px solid #1e1e2e; }
    .col-chat  { flex: 1; border-right: 1px solid #1e1e2e; }
    .col-log   { flex: 0 0 340px; }

    .col-header {
      padding: 10px 16px;
      border-bottom: 1px solid #1e1e2e;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4b5563;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* ── VOICE column ── */
    .voice-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 16px;
    }

    #orb {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #7c3aed, #4c1d95);
      box-shadow: 0 0 40px #7c3aed44;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.9rem;
      user-select: none;
    }
    #orb.listening { animation: pulse 1.2s ease-in-out infinite; box-shadow: 0 0 60px #7c3aedaa; }
    #orb.speaking  { animation: bounce 0.6s ease-in-out infinite alternate; box-shadow: 0 0 60px #06b6d4aa; background: radial-gradient(circle at 40% 40%, #0891b2, #164e63); }

    @keyframes pulse  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    @keyframes bounce { 0%{transform:scale(1)} 100%{transform:scale(1.05)} }

    #voice-status {
      font-size: 0.78rem; color: #6b7280;
      text-align: center; min-height: 18px;
      padding: 0 8px;
    }

    .voice-btns { display: flex; gap: 8px; }

    button {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid #2d2d3d;
      background: #1a1a24;
      color: #9ca3af;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #252535; color: #e8e8f0; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #start-btn { background: #4c1d95; border-color: #7c3aed; color: #e8e8f0; }
    #start-btn:hover:not(:disabled) { background: #5b21b6; }
    #stop-btn:not(:disabled) { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }

    /* ── CHAT column ── */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message { display: flex; flex-direction: column; gap: 3px; }
    .message .label {
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .message.user .label      { color: #a78bfa; }
    .message.assistant .label { color: #06b6d4; }
    .message.user .bubble     { background: #1e1a2e; border: 1px solid #3b2f6e; }
    .message.assistant .bubble{ background: #0d1f2d; border: 1px solid #0e4c6e; }
    .bubble {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      line-height: 1.55;
      color: #d1d5db;
    }

    .chat-input-row {
      border-top: 1px solid #1e1e2e;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #chat-input {
      flex: 1;
      background: #1a1a24;
      border: 1px solid #2d2d3d;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e8e8f0;
      font-size: 0.84rem;
      outline: none;
    }
    #chat-input:focus { border-color: #7c3aed; }
    #send-btn { background: #4c1d95; border-color: #7c3aed; color: #e8e8f0; }
    #send-btn:hover:not(:disabled) { background: #5b21b6; }

    /* ── LOG column — split into two rows ── */
    .col-log { display: flex; flex-direction: column; overflow: hidden; }

    .log-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .log-pane-errors  { flex: 0 0 40%; border-bottom: 1px solid #1e1e2e; }
    .log-pane-context { flex: 1; }

    .log-pane-header {
      padding: 7px 12px;
      border-bottom: 1px solid #1e1e2e;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4b5563;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .log-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.67rem;
    }

    /* error log entries */
    .log-entry { display: flex; gap: 6px; line-height: 1.5; }
    .log-entry .ts  { color: #2d3748; flex-shrink: 0; }
    .log-entry .tag { flex-shrink: 0; font-weight: 700; width: 60px; }
    .log-entry .msg { color: #6b7280; word-break: break-word; }
    .log-entry.info    .tag { color: #6366f1; }
    .log-entry.success .tag { color: #22c55e; }
    .log-entry.warn    .tag { color: #f59e0b; }
    .log-entry.error   .tag { color: #ef4444; }
    .log-entry.tool    .tag { color: #06b6d4; }
    .log-entry.speech  .tag { color: #a78bfa; }
    .log-entry.ws      .tag { color: #475569; }

    /* context pane — turns */
    .ctx-turn {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 4px 0;
      border-bottom: 1px solid #16161e;
    }
    .ctx-turn .ctx-role {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .ctx-turn.ctx-user .ctx-role     { color: #7c3aed; }
    .ctx-turn.ctx-assistant .ctx-role{ color: #0891b2; }
    .ctx-turn.ctx-memory .ctx-role   { color: #d97706; }
    .ctx-turn.ctx-memory .ctx-text   { color: #78350f; font-style: italic; }
    .ctx-turn .ctx-text {
      color: #4b5563;
      font-size: 0.67rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #clear-log { font-size: 0.6rem; padding: 2px 6px; }
    #clear-chat { font-size: 0.65rem; padding: 2px 7px; }
  </style>
</head>
<body>

<header>
  <div class="dot" id="ws-dot"></div>
  <h1>Voice Agent</h1>

  <!-- name entry -->
  <div class="name-area" id="name-entry-area">
    <label for="name-input">Who are you?</label>
    <input id="name-input" type="text" placeholder="Enter your name…" autocomplete="off" list="known-users-list" />
    <datalist id="known-users-list"></datalist>
    <button id="name-set-btn">Start</button>
  </div>

  <!-- badge shown after name is set -->
  <div class="name-area" id="name-badge-area">
    <div class="name-badge">
      <span id="name-badge-text"></span>
      <button class="change-btn" id="name-change-btn" title="Change user">✕</button>
    </div>
  </div>
</header>

<div class="layout">

  <!-- ── COL 1: VOICE ── -->
  <div class="col col-voice">
    <div class="col-header">Voice</div>
    <div class="voice-body">
      <div id="orb" title="Click to start">🎙️</div>
      <div id="voice-status">Click Start to begin talking</div>
      <div class="voice-btns">
        <button id="start-btn">Start</button>
        <button id="stop-btn" disabled>Stop</button>
      </div>
      <select id="voice-select" title="TTS Voice" style="margin-top:8px;width:100%;font-size:0.75rem;background:#1a1a2e;color:#c8c8d8;border:1px solid #333;border-radius:6px;padding:4px 6px;">
        <option value="en-IN-NeerjaNeural">Neerja — English IN ♀</option>
        <option value="en-IN-PrabhatNeural">Prabhat — English IN ♂</option>
        <option value="hi-IN-SwaraNeural">Swara — Hindi ♀</option>
        <option value="hi-IN-MadhurNeural">Madhur — Hindi ♂</option>
        <option value="en-US-AriaNeural">Aria — English US ♀</option>
        <option value="en-US-GuyNeural">Guy — English US ♂</option>
        <option value="en-GB-SoniaNeural">Sonia — English UK ♀</option>
      </select>
    </div>
  </div>

  <!-- ── COL 2: CHAT ── -->
  <div class="col col-chat">
    <div class="col-header">
      Chat
      <button id="clear-chat">Clear</button>
    </div>
    <div id="chat-messages"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" placeholder="Type a message…" autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- ── COL 3: ERRORS + CONTEXT ── -->
  <div class="col col-log">
    <!-- row 1: errors only -->
    <div class="log-pane log-pane-errors">
      <div class="log-pane-header">
        Errors
        <button id="clear-log">Clear</button>
      </div>
      <div class="log-scroll" id="error-box"></div>
    </div>
    <!-- row 2: shared session context -->
    <div class="log-pane log-pane-context">
      <div class="log-pane-header">Session Context</div>
      <div class="log-scroll" id="context-box"></div>
    </div>
  </div>

</div>

<script>
  const orb             = document.getElementById("orb");
  const voiceStatus     = document.getElementById("voice-status");
  const startBtn        = document.getElementById("start-btn");
  const stopBtn         = document.getElementById("stop-btn");
  const voiceSelect     = document.getElementById("voice-select");
  const chatMessages    = document.getElementById("chat-messages");
  const chatInput       = document.getElementById("chat-input");
  const sendBtn         = document.getElementById("send-btn");
  const clearChat       = document.getElementById("clear-chat");
  const errorBox        = document.getElementById("error-box");
  const contextBox      = document.getElementById("context-box");
  const clearLogBtn     = document.getElementById("clear-log");
  const wsDot           = document.getElementById("ws-dot");
  const nameEntryArea   = document.getElementById("name-entry-area");
  const nameBadgeArea   = document.getElementById("name-badge-area");
  const nameInput       = document.getElementById("name-input");
  const nameSetBtn      = document.getElementById("name-set-btn");
  const nameBadgeText   = document.getElementById("name-badge-text");
  const nameChangeBtn   = document.getElementById("name-change-btn");
  const knownUsersList  = document.getElementById("known-users-list");

  // ── Error logger (row 1 — errors only) ──────────────────────────────────────
  function log(type, tag, msg) {
    if (!["error", "warn", "info"].includes(type)) return;
    const el = document.createElement("div");
    el.className = `log-entry ${type}`;
    const ts = new Date().toTimeString().slice(0, 8);
    el.innerHTML = `<span class="ts">${ts}</span><span class="tag">[${tag}]</span><span class="msg">${escapeHtml(String(msg))}</span>`;
    errorBox.appendChild(el);
    errorBox.scrollTop = errorBox.scrollHeight;
    while (errorBox.children.length > 200) errorBox.removeChild(errorBox.firstChild);
  }
  clearLogBtn.addEventListener("click", () => errorBox.innerHTML = "");

  // ── Session context (row 2 — conversation turns) ─────────────────────────────
  let pendingContextEl = null; // streaming assistant turn

  function addContextTurn(role, text) {
    const el = document.createElement("div");
    el.className = `ctx-turn ctx-${role}`;
    const label = role === "user" ? "You" : "Agent";
    el.innerHTML = `<span class="ctx-role">${label}</span><span class="ctx-text">${escapeHtml(text)}</span>`;
    contextBox.appendChild(el);
    contextBox.scrollTop = contextBox.scrollHeight;
    while (contextBox.children.length > 120) contextBox.removeChild(contextBox.firstChild);
    return el;
  }

  function startStreamingContextTurn() {
    pendingContextEl = document.createElement("div");
    pendingContextEl.className = "ctx-turn ctx-assistant";
    pendingContextEl.innerHTML = `<span class="ctx-role">Agent</span><span class="ctx-text"></span>`;
    contextBox.appendChild(pendingContextEl);
    contextBox.scrollTop = contextBox.scrollHeight;
  }

  function appendContextToken(text) {
    if (!pendingContextEl) return;
    pendingContextEl.querySelector(".ctx-text").textContent += text;
    contextBox.scrollTop = contextBox.scrollHeight;
  }

  function finaliseContextTurn() {
    pendingContextEl = null;
  }

  // ── Shared state ─────────────────────────────────────────────────────────────
  let currentAssistantEl = null;
  let active = false;
  let recognition = null;
  let lastSource = "chat"; // "voice" or "chat" — controls whether agent speaks
  let pendingGreeting = null; // memory greeting to speak on voice session start

  // ── WebSocket ─────────────────────────────────────────────────────────────────
  const ws = new WebSocket(`ws://${location.host}`);

  ws.onopen  = () => {
    wsDot.classList.add("alive");
    // Restore name from localStorage
    const saved = localStorage.getItem("va_user_name");
    if (saved) setUser(saved);
  };
  ws.onclose = () => { wsDot.classList.remove("alive"); log("error", "WS", "Disconnected from server"); };
  ws.onerror = () => log("error", "WS", "WebSocket connection error");

  // ── Name / user management ────────────────────────────────────────────────────
  function setUser(name) {
    if (!name?.trim()) return;
    name = name.trim();
    localStorage.setItem("va_user_name", name);
    nameBadgeText.textContent = name;
    nameEntryArea.style.display = "none";
    nameBadgeArea.style.display = "flex";
    // Disable voice/chat until user is set — now re-enable
    startBtn.disabled = false;
    chatInput.disabled = false;
    sendBtn.disabled = false;
    // Tell the server
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "set_user", name }));
    }
    // Reset context pane for the new user
    contextBox.innerHTML = "";
    chatMessages.innerHTML = "";
    pendingGreeting = null;
  }

  function clearUser() {
    localStorage.removeItem("va_user_name");
    nameInput.value = "";
    nameBadgeArea.style.display = "none";
    nameEntryArea.style.display = "flex";
    startBtn.disabled = true;
    chatInput.disabled = true;
    sendBtn.disabled = true;
    contextBox.innerHTML = "";
    chatMessages.innerHTML = "";
    if (active) endSession();
  }

  nameSetBtn.addEventListener("click", () => setUser(nameInput.value));
  nameInput.addEventListener("keydown", e => { if (e.key === "Enter") setUser(nameInput.value); });
  nameChangeBtn.addEventListener("click", clearUser);

  // Disable voice/chat by default until a name is entered
  startBtn.disabled = true;
  chatInput.disabled = true;
  sendBtn.disabled = true;

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    if (msg.type === "known_users") {
      knownUsersList.innerHTML = "";
      (msg.users || []).forEach(key => {
        const opt = document.createElement("option");
        // Convert key back to display form: "gourab_chanda" → "Gourab Chanda"
        opt.value = key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
        knownUsersList.appendChild(opt);
      });
    }

    if (msg.type === "memory_greeting") {
      pendingGreeting = msg.text;
      // Show in context pane as a memory card
      const el = document.createElement("div");
      el.className = "ctx-turn ctx-memory";
      el.innerHTML = `<span class="ctx-role">Memory</span><span class="ctx-text">${escapeHtml(msg.text)}</span>`;
      contextBox.appendChild(el);
      contextBox.scrollTop = contextBox.scrollHeight;
    }

    if (msg.type === "thinking") {
      setVoiceStatus("Agent thinking…");
      orb.className = "";
      if (lastSource !== "voice") appendAssistantBubble();
      startStreamingContextTurn();
    }

    if (msg.type === "tool_call") {
      const toolLabel = msg.tool ? msg.tool.replace("get_", "") : "data";
      setVoiceStatus(`Fetching ${toolLabel}…`);
      // Speak a filler phrase so the voice session doesn't go silent
      if (lastSource === "voice") {
        const fillers = [
          "Let me check that for you.",
          "One moment, looking that up.",
          "Give me just a second.",
          "Sure, fetching that now.",
          "On it, just a moment.",
          "Let me pull that up for you.",
          "Hold on, checking right now.",
        ];
        const phrase = fillers[Math.floor(Math.random() * fillers.length)];
        speak(phrase, null); // no onEnd — real answer arrives in "done" and will cancel this
      }
    }

    if (msg.type === "callback_result") {
      // Server fetched a deferred result — show it proactively
      if (lastSource !== "voice") {
        appendAssistantBubble();
        if (currentAssistantEl) {
          currentAssistantEl.querySelector(".bubble").textContent = msg.text;
        }
        currentAssistantEl = null;
      } else {
        orb.className = "speaking";
        speak(msg.text, () => { orb.className = ""; if (active) setTimeout(() => listen(), 600); });
      }
    }

    if (msg.type === "token") {
      if (currentAssistantEl) {
        currentAssistantEl.querySelector(".bubble").textContent += msg.text;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
      appendContextToken(msg.text);
    }

    if (msg.type === "done") {
      finaliseContextTurn();
      currentAssistantEl = null;
      setSendEnabled(true);

      if (lastSource === "voice") {
        orb.className = "speaking";
        setVoiceStatus("Agent speaking…");
        startBargeMonitor(); // listen for user interruption while TTS plays
        speak(msg.fullText, () => {
          stopBargeMonitor(); // TTS finished naturally — stop barge SR
          orb.className = "";
          if (active) {
            setVoiceStatus("Starting mic…");
            setTimeout(() => { if (active) listen(); }, 600);
          } else {
            setVoiceStatus("Click Start to begin talking");
          }
        });
      } else {
        // chat: no speaking — if voice session is on, restart mic
        if (active) {
          setTimeout(() => { if (active) listen(); }, 300);
        } else {
          orb.className = "";
          setVoiceStatus("Click Start to begin talking");
        }
      }
    }

    if (msg.type === "error") {
      log("error", "ERROR", msg.message || "Unknown error");
      finaliseContextTurn();
      currentAssistantEl = null;
      setSendEnabled(true);
      orb.className = "";
      active = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setVoiceStatus("❌ " + (msg.message || "Error — see Errors panel"));
    }

    if (msg.type === "reset_ok") {
      chatMessages.innerHTML = "";
      contextBox.innerHTML = "";
      setVoiceStatus(active ? "Listening… speak now" : "Click Start to begin talking");
    }
  };

  // ── Send a message (shared by voice + chat) ──────────────────────────────────
  function sendMessage(text, fromVoice = false) {
    text = text.trim();
    if (!text || ws.readyState !== WebSocket.OPEN) return;
    lastSource = fromVoice ? "voice" : "chat";
    if (!fromVoice) {
      // Typed chat: show in chat column
      appendUserBubble(text);
      // Pause mic while waiting for chat reply (will restart in done handler)
      stopMic();
      setSendEnabled(false);
    }
    addContextTurn("user", text);
    ws.send(JSON.stringify({ type: "user_speech", text }));
  }

  // ── Chat input ────────────────────────────────────────────────────────────────
  sendBtn.addEventListener("click", () => {
    sendMessage(chatInput.value);
    chatInput.value = "";
  });
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(chatInput.value);
      chatInput.value = "";
    }
  });
  clearChat.addEventListener("click", () => {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "reset" }));
  });

  // ── TTS — Edge Neural TTS via /api/tts ────────────────────────────────────────
  let _ttsAudio = null;   // current HTMLAudioElement
  let _ttsOnEnd = null;   // current completion callback
  let _ttsPlaying = false;
  let selectedVoice = localStorage.getItem("va_tts_voice") || "en-IN-NeerjaNeural";
  voiceSelect.value = selectedVoice;
  voiceSelect.addEventListener("change", () => {
    selectedVoice = voiceSelect.value;
    localStorage.setItem("va_tts_voice", selectedVoice);
  });

  // Edge TTS requires outbound WebSocket to Microsoft — disabled by default
  // if behind a corporate proxy. Set to true only if confirmed reachable.
  let _edgeTTSAvailable = localStorage.getItem("va_edge_tts") === "true";

  // Keep fallback utterance at module scope to prevent Chrome GC bug
  let _fbUtterance = null;

  function speakFallback(text, onEnd) {
    log("warn", "TTS", "Using Web Speech API fallback");
    window.speechSynthesis.cancel();
    _ttsPlaying = true;

    _fbUtterance = new SpeechSynthesisUtterance(text);
    _fbUtterance.rate = 1.05;

    const done = () => {
      _ttsPlaying = false;
      _fbUtterance = null;
      if (onEnd) onEnd();
    };

    // Attach handlers BEFORE speak()
    let _fbTimeout = null;
    _fbUtterance.onend   = () => { clearTimeout(_fbTimeout); done(); };
    _fbUtterance.onerror = (e) => {
      if (e.error === "interrupted" || e.error === "canceled") return; // expected on cancel
      clearTimeout(_fbTimeout); done();
    };

    // Voice selection — voices may not be loaded yet on first call
    const trySpeak = () => {
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.startsWith("en-IN")) ||
                        voices.find(v => v.lang.startsWith("en-US")) || null;
      if (preferred && _fbUtterance) _fbUtterance.voice = preferred;
      window.speechSynthesis.speak(_fbUtterance);
      // Timeout fallback: Chrome sometimes never fires onend
      _fbTimeout = setTimeout(() => {
        window.speechSynthesis.cancel();
        done();
      }, Math.max(4000, text.length * 75));
    };

    // If voices not loaded yet, wait for them
    if (window.speechSynthesis.getVoices().length > 0) {
      trySpeak();
    } else {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.onvoiceschanged = null;
        trySpeak();
      };
      // Safety: if onvoiceschanged never fires, speak anyway after 300ms
      setTimeout(() => { if (_ttsPlaying && _fbUtterance && !_fbUtterance.src) trySpeak(); }, 300);
    }
  }

  function speak(text, onEnd) {
    stopTTS();
    _ttsOnEnd = onEnd;
    _ttsPlaying = true;

    if (!_edgeTTSAvailable) { speakFallback(text, onEnd); return; }

    const audio = new Audio();
    _ttsAudio = audio;

    const finish = (reason) => {
      if (!_ttsPlaying) return;
      _ttsPlaying = false;
      _ttsAudio = null;
      log("warn", "TTS", "finished: " + reason);
      const cb = _ttsOnEnd;
      _ttsOnEnd = null;
      if (cb) cb();
    };

    audio.onended = () => finish("ended");
    audio.onerror = (e) => { log("error", "TTS", "audio error"); finish("error"); };

    fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, voice: selectedVoice }),
    })
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.blob();
      })
      .then(blob => {
        if (!_ttsPlaying) return;
        if (blob.size < 100) throw new Error("empty audio blob");
        audio.src = URL.createObjectURL(blob);
        return audio.play();
      })
      .catch(e => {
        log("error", "TTS", "Edge TTS failed: " + e.message + " — switching to fallback");
        _edgeTTSAvailable = false;
        _ttsPlaying = false;
        _ttsAudio = null;
        _ttsOnEnd = null;
        speakFallback(text, onEnd);
      });
  }

  function stopTTS() {
    _ttsPlaying = false;
    _ttsOnEnd = null;
    if (_ttsAudio) {
      _ttsAudio.pause();
      if (_ttsAudio.src) URL.revokeObjectURL(_ttsAudio.src);
      _ttsAudio = null;
    }
    // Also cancel fallback Web Speech if active
    if (_fbUtterance) { window.speechSynthesis.cancel(); _fbUtterance = null; }
  }

  // ── Barge-in via SpeechRecognition ───────────────────────────────────────────
  // Run a dedicated continuous SR instance while TTS is playing.
  // Any speech detected = barge-in: stop audio, start listen().
  // Using SR (not Web Audio API) avoids AudioContext suspension issues in Chrome.
  let _bargeSR = null;

  function startBargeMonitor() {
    if (_bargeSR || !SpeechRecognition) return;
    const r = new SpeechRecognition();
    _bargeSR = r;
    r.lang = "en-US";
    r.continuous = true;
    r.interimResults = true;

    r.onresult = (e) => {
      if (_bargeSR !== r) return;
      if (!_ttsPlaying) return; // TTS already done
      let heard = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        heard += e.results[i][0].transcript;
      }
      if (!heard.trim()) return;
      log("warn", "BARGE", `Barge-in: "${heard.trim().slice(0, 40)}"`);
      stopBargeMonitor();
      stopTTS();
      orb.className = "";
      setTimeout(() => { if (active) listen(); }, 150);
    };

    r.onerror = (e) => {
      if (_bargeSR !== r) return;
      if (e.error === "no-speech") {
        stopBargeMonitor();
        if (active && _ttsPlaying) startBargeMonitor();
        return;
      }
      if (e.error !== "aborted") log("warn", "BARGE", "SR error: " + e.error);
    };

    r.onend = () => {
      if (_bargeSR !== r) return;
      _bargeSR = null;
      if (active && _ttsPlaying) startBargeMonitor(); // Chrome stops SR after ~60s
    };

    try { r.start(); }
    catch (e) { _bargeSR = null; log("warn", "BARGE", "Could not start barge SR: " + e.message); }
  }

  function stopBargeMonitor() {
    if (_bargeSR) {
      const r = _bargeSR;
      _bargeSR = null;
      try { r.abort(); } catch(e) {}
    }
  }

  // ── Voice ──────────────────────────────────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function stopMic() {
    if (recognition) {
      const r = recognition;
      recognition = null;       // null BEFORE abort so stale onend doesn't restart
      orb.className = "";       // clear state so onend guard fails
      try { r.abort(); } catch(e) {}
    }
  }

  function listen() {
    if (!active) return;
    if (!SpeechRecognition) {
      log("error", "MIC", "Not supported — use Chrome");
      setVoiceStatus("Use Chrome");
      return;
    }
    stopMic(); // kill any existing instance cleanly

    const r = new SpeechRecognition();
    recognition = r;
    r.lang = "en-US";
    r.continuous = false;
    r.interimResults = true;

    orb.className = "listening";
    setVoiceStatus("Listening… speak now");
    log("warn", "MIC", "Mic opened");

    r.onresult = (e) => {
      let interim = "", final = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (interim) setVoiceStatus("You: " + interim);
      if (final) {
        orb.className = "";
        setVoiceStatus("Sending…");
        sendMessage(final.trim(), true);
      }
    };

    r.onerror = (e) => {
      if (recognition !== r) return; // stale instance — ignore
      if (e.error === "no-speech" && active) { listen(); return; }
      if (e.error === "not-allowed") log("error", "MIC", "Microphone permission denied");
      else if (e.error !== "aborted") log("warn", "MIC", e.error);
      if (e.error !== "aborted") setVoiceStatus("Mic error: " + e.error);
    };

    r.onend = () => {
      if (recognition !== r) return; // stale instance — ignore
      if (active && orb.className === "listening") listen();
    };

    r.start();
  }

  function beginSession() {
    active = true;
    lastSource = "voice"; // ensure agent speaks on first response
    startBtn.disabled = true;
    stopBtn.disabled = false;
    const greeting = pendingGreeting;
    pendingGreeting = null; // clear immediately — re-start never replays
    if (greeting) {
      // Speak memory greeting first, then start listening
      orb.className = "speaking";
      setVoiceStatus("Agent speaking…");
      startBargeMonitor();
      speak(greeting, () => {
        stopBargeMonitor();
        orb.className = "";
        // Small delay so TTS audio fully drains before mic opens
        setTimeout(() => { if (active) listen(); }, 600);
      });
    } else {
      listen();
    }
  }

  function endSession() {
    active = false;
    stopMic();
    stopBargeMonitor();
    stopTTS();
    orb.className = "";
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setVoiceStatus("Click Start to begin talking");
  }

  orb.addEventListener("click", () => active ? endSession() : beginSession());
  startBtn.addEventListener("click", beginSession);
  stopBtn.addEventListener("click", endSession);

  // ── Bubble helpers ─────────────────────────────────────────────────────────────
  function appendUserBubble(text) {
    const el = document.createElement("div");
    el.className = "message user";
    el.innerHTML = `<span class="label">You</span><div class="bubble">${escapeHtml(text)}</div>`;
    chatMessages.appendChild(el);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function appendAssistantBubble() {
    const el = document.createElement("div");
    el.className = "message assistant";
    el.innerHTML = `<span class="label">Agent</span><div class="bubble"></div>`;
    chatMessages.appendChild(el);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    currentAssistantEl = el;
  }

  function setVoiceStatus(t) { voiceStatus.textContent = t; }
  function setSendEnabled(v) { sendBtn.disabled = !v; chatInput.disabled = !v; }
  function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
</script>
</body>
</html>
